tags:
  - Auth
summary: Send reset password email
operationId: sendResetPasswordEmail
description: 'Send an email to reset the user password'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            format: email
            example: user@example.com
        required:
          - email
responses:
  '200':
    description: Password reset email successfully sent
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password reset email successfully sent!'
  '400':
    description: Invalid email address or request
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid email address or request.'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    description: User not found with the provided email address
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'User not found with the provided email address.'
