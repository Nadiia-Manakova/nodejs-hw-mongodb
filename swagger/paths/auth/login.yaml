tags:
  - Auth
summary: login user
operationId: loginUser
description: 'Logged in an user!'
security:
  - bearerAuth: []
parameters: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            example: user@example.com
          password:
            type: string
            example: MySecurePassword123
        required:
          - email
          - password
responses:
  '200':
    description: Successfully logged in an user!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
  '401':
    $ref: '../../components/responses/401.yaml'
