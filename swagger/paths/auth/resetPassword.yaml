tags:
  - Auth
summary: reset password
operationId: resetPassword
description: 'Reset a Password!'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          access_token:
            type: string
            example: NBjFgb7fPPokFsViXc5XwTP5uBX5u5TBeiHAthtZvnDutmAi5uQ
          password:
            type: string
            example: MySecurePassword123
        required:
          - access_token
          - password
responses:
  '200':
    description: Password was successfully reset!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password was successfully reset!
  '401':
    $ref: '../../components/responses/401.yaml'
